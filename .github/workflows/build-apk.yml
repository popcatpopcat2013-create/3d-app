name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Needed so the job can attach the APK to a GitHub Release
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds our own code. The android/ folder is generated
      # by Flutter here, then patched with the permissions the app needs.
      - name: Create Android project (when the repo has none)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.photoswipe --project-name photo_swipe "$RUNNER_TEMP/scaffold"
            cp -r "$RUNNER_TEMP/scaffold/android" android
          fi

      - name: Patch Android manifest
        run: python3 tools/patch_android.py

      # Optional: keeps the same signing key on every build so phones can
      # update the app in place. See README, section "Signing key".
      - name: Restore signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using the stored signing key."
          else
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret. This APK gets a throwaway key, so phones must uninstall the old version before installing a new one."
          fi

      - name: Install packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK
        id: apk
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="photo-swipe-${GITHUB_REF_NAME}.apk"
          else
            NAME="photo-swipe-${GITHUB_SHA::7}.apk"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Every build: downloadable from the run page (Actions tab)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      # Only when you push a tag like v0.1.0: public download on the Releases page
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
